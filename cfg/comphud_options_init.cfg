// Initializes shared HUD options when opened from the menu.
// Captions and timer form one saved profile: off, captions only, or captions + timer.
// Off is a safe first-install fallback; the user-owned profile is restored afterwards.
alias compHUD_options_idle ""
alias compHUD_uber_timer_emit "cc_emit CompHUD.UberTimer.Manual"
alias compHUD_caption_setup "cc_lang comp; cc_subtitles 0; cc_predisplay_time 0"
// Keep profile definitions below Source's 511-byte command rejection boundary (none).
alias compHUD_gate_none "closecaption 0; alias compHUD_captions_toggle compHUD_captions_on; alias compHUD_uber_timer_press compHUD_options_idle; alias compHUD_uber_timer_toggle compHUD_options_idle; alias compHUD_uber_timer_on compHUD_options_idle; alias compHUD_uber_timer_off compHUD_options_idle"
alias compHUD_saved_none "alias compHUD_options_restore compHUD_options_apply_none; alias compHUD_options_save_cfg echo compHUD_options_apply_none; alias compHUD_options_save_animation compHUD_ui_none"
alias compHUD_options_apply_none "compHUD_gate_none; compHUD_saved_none"
// Keep profile definitions below Source's 511-byte command rejection boundary (captions).
alias compHUD_gate_captions "closecaption 1; compHUD_caption_setup; alias compHUD_captions_toggle compHUD_captions_off; alias compHUD_uber_timer_press compHUD_options_idle; alias compHUD_uber_timer_toggle compHUD_timer_enable; alias compHUD_uber_timer_on compHUD_timer_enable; alias compHUD_uber_timer_off compHUD_timer_disable"
alias compHUD_saved_captions "alias compHUD_options_restore compHUD_options_apply_captions; alias compHUD_options_save_cfg echo compHUD_options_apply_captions; alias compHUD_options_save_animation compHUD_ui_captions"
alias compHUD_options_apply_captions "compHUD_gate_captions; compHUD_saved_captions"
// Keep profile definitions below Source's 511-byte command rejection boundary (timer).
alias compHUD_gate_timer "closecaption 1; compHUD_caption_setup; alias compHUD_captions_toggle compHUD_captions_off; alias compHUD_uber_timer_press compHUD_uber_timer_emit; alias compHUD_uber_timer_toggle compHUD_timer_disable; alias compHUD_uber_timer_on compHUD_timer_enable; alias compHUD_uber_timer_off compHUD_timer_disable"
alias compHUD_saved_timer "alias compHUD_options_restore compHUD_options_apply_timer; alias compHUD_options_save_cfg echo compHUD_options_apply_timer; alias compHUD_options_save_animation compHUD_ui_timer"
alias compHUD_options_apply_timer "compHUD_gate_timer; compHUD_saved_timer"
// Immutable timer visuals are switched by the native SafeMode layout animation.
alias compHUD_ui_none "echo SetVisible UberTimerDisabled 1 0; echo SetVisible UberTimerAvailable 0 0; echo SetVisible UberTimerSelected 0 0; echo SetVisible UberTimerAction 0 0; echo SetInputEnabled UberTimerAction 0 0"
alias compHUD_ui_captions "echo SetVisible UberTimerDisabled 0 0; echo SetVisible UberTimerAvailable 1 0; echo SetVisible UberTimerSelected 0 0; echo SetVisible UberTimerAction 1 0; echo SetInputEnabled UberTimerAction 1 0"
alias compHUD_ui_timer "echo SetVisible UberTimerDisabled 0 0; echo SetVisible UberTimerAvailable 0 0; echo SetVisible UberTimerSelected 1 0; echo SetVisible UberTimerAction 1 0; echo SetInputEnabled UberTimerAction 1 0"
// Both caption transitions clear the timer; only its own checkbox can enable it.
alias compHUD_captions_on "compHUD_options_apply_captions; exec comphud_options_save; host_writeconfig"
alias compHUD_captions_off "compHUD_options_apply_none; exec comphud_options_save; host_writeconfig"
alias compHUD_timer_enable "compHUD_options_apply_timer; exec comphud_options_save"
alias compHUD_timer_disable "compHUD_options_apply_captions; exec comphud_options_save"
// Normalize the saved checkbox state before showing the options, including old profiles.
alias compHUD_options_open "compHUD_options_restore; compHUD_vm_restore; compHUD_vm_level_restore; compHUD_amby_restore; exec comphud_options_save; cl_mainmenu_safemode 1"
// Restores the off profile for legacy timer-only saves to enforce the caption prerequisite.
alias compHUD_uber_timer_apply_on compHUD_options_apply_none
alias compHUD_uber_timer_apply_off compHUD_options_apply_none
compHUD_options_apply_none
exec comphud_viewmodels
exec comphud_shortcuts
exec comphud_ambassador
exec comphud_options_saved.txt
