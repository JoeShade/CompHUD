// End the native note editor's capture before any shortcut or options output.
con_logfile ""
alias compHUD_shortcuts_begin "exec comphud_shortcuts_begin"
// Reload the scoreboard after the note has been closed. The SafeMode layout also
// dispatches the shortcut commit after native OK has queued all four STRING rows.
hud_reloadscheme
cl_mainmenu_safemode 0
cl_mainmenu_safemode 1
sixense_write_bindings comphud_shortcuts_restore.cfg
sixense_clear_bindings
alias compHUD_shortcuts_commit "exec comphud_shortcuts_commit"
