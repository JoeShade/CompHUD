// Refresh the saved event and request a native menu layout before staging text.
// That layout dispatches commit after native OK has queued all four STRING rows.
// Refresh first: options saving also uses the controller writer.
compHUD_options_open
con_logfile ""
sixense_write_bindings comphud_shortcuts_restore.cfg
sixense_clear_bindings
alias compHUD_shortcuts_commit "exec comphud_shortcuts_commit"
