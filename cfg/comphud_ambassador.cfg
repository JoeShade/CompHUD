// Saves the HUD Ambassador overlay preference.
// Default on preserves the existing Ambassador artwork for older saved profiles.
alias compHUD_amby_ui_off "echo SetVisible AmbassadorAvailable 1 0; echo SetVisible AmbassadorSelected 0 0"
alias compHUD_amby_ui_on "echo SetVisible AmbassadorAvailable 0 0; echo SetVisible AmbassadorSelected 1 0"
alias compHUD_amby_mask_off "echo visible 0; echo enabled 0"
alias compHUD_amby_mask_on "echo visible 1; echo enabled 1"
alias compHUD_amby_apply_off "alias compHUD_amby_restore compHUD_amby_apply_off; alias compHUD_amby_toggle compHUD_amby_enable; alias compHUD_amby_save_cfg echo compHUD_amby_apply_off; alias compHUD_amby_save_ui compHUD_amby_ui_off; alias compHUD_amby_save_mask compHUD_amby_mask_off"
alias compHUD_amby_apply_on "alias compHUD_amby_restore compHUD_amby_apply_on; alias compHUD_amby_toggle compHUD_amby_disable; alias compHUD_amby_save_cfg echo compHUD_amby_apply_on; alias compHUD_amby_save_ui compHUD_amby_ui_on; alias compHUD_amby_save_mask compHUD_amby_mask_on"
alias compHUD_amby_enable "compHUD_amby_apply_on; exec comphud_options_save"
alias compHUD_amby_disable "compHUD_amby_apply_off; exec comphud_options_save"
compHUD_amby_apply_on
