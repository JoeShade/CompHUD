// Independent saved option. Defaults off; the combined user profile is restored afterwards.
// Refract needs the DX9 motion-blur pipeline, with blur strength zero for a sharp image.
// Selecting transparent viewmodels applies the rendering prerequisites; disabling hides the mask.
alias compHUD_vm_setup "mat_motion_blur_enabled 1; mat_motion_blur_strength 0; mat_disable_bloom 1; mat_hdr_level 0; mat_antialias 0; mat_colcorrection_disableentities 1; mat_colorcorrection 0"
alias compHUD_vm_ui_off "echo SetVisible ViewmodelsAvailable 1 0; echo SetVisible ViewmodelsSelected 0 0"
alias compHUD_vm_ui_on "echo SetVisible ViewmodelsAvailable 0 0; echo SetVisible ViewmodelsSelected 1 0"
alias compHUD_vm_mask_off "echo visible 0; echo enabled 0"
alias compHUD_vm_mask_on "echo visible 1; echo enabled 1"
alias compHUD_vm_apply_off "alias compHUD_vm_restore compHUD_vm_apply_off; alias compHUD_vm_toggle compHUD_vm_enable; alias compHUD_vm_save_cfg echo compHUD_vm_apply_off; alias compHUD_vm_save_animation compHUD_vm_ui_off; alias compHUD_vm_save_mask compHUD_vm_mask_off"
alias compHUD_vm_apply_on "compHUD_vm_setup; alias compHUD_vm_restore compHUD_vm_apply_on; alias compHUD_vm_toggle compHUD_vm_disable; alias compHUD_vm_save_cfg echo compHUD_vm_apply_on; alias compHUD_vm_save_animation compHUD_vm_ui_on; alias compHUD_vm_save_mask compHUD_vm_mask_on"
alias compHUD_vm_enable "compHUD_vm_apply_on; exec comphud_options_save"
alias compHUD_vm_disable "compHUD_vm_apply_off; exec comphud_options_save"
exec comphud_viewmodel_levels
compHUD_vm_apply_off
