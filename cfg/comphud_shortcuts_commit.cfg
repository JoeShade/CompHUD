// Snapshot all four text values, then publish a quoted KeyValues menu override.
// sixense_list_bindings prints six tokens per record: two harmless metadata pairs
// followed by our tooltip/command pair. Unlike echo, it preserves quotes around text.
// Called by the hidden menu relay after capture; restore controller state before returning.
con_logfile ""
sixense_write_bindings comphud_shortcuts_pending.cfg
sixense_clear_bindings
sixense_write_bindings comphud_shortcuts.txt
exec comphud_shortcuts_pending.cfg
sixense_delete_binding 2
sixense_delete_binding 2
con_timestamp 0
con_logfile cfg/comphud_shortcuts.txt
echo "// RESOURCE: Restores the native editor's saved shortcut labels and commands."
echo GameMenu
echo "{"
echo "// PANEL OVERRIDE: Supplies the Walkway icon's editable action and hover text."
echo WalkwayButton
echo "{"
sixense_list_bindings
echo "}"
con_logfile ""
sixense_clear_bindings
exec comphud_shortcuts_pending.cfg
sixense_delete_binding 0
sixense_delete_binding 0
con_logfile cfg/comphud_shortcuts.txt
echo "// PANEL OVERRIDE: Supplies the rocket-training icon's editable action and hover text."
echo RocketShootingButton
echo "{"
sixense_list_bindings
echo "}"
echo "}"
con_logfile ""
sixense_clear_bindings
exec comphud_shortcuts_restore.cfg
alias compHUD_shortcuts_commit compHUD_shortcuts_idle
