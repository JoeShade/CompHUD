// The notes editor saved the controller bindings. Closing the last note leaves
// the temporary binding list empty so each checkbox can start a fresh file.
compHUD_notes_close
alias compHUD_pick_header "echo UnlitGeneric; echo {"
alias compHUD_pick_close "echo }; con_logfile cfg/comphud_notes_handoff.txt"
// Each checkbox supplies its own 0/1 value to echo $frame after opening the file.
alias compHUD_pick_soldier  "compHUD_pick_close; sixense_write_bindings comphud_pick_soldier.txt; con_logfile cfg/comphud_pick_soldier.txt; compHUD_pick_header"
alias compHUD_pick_pyro     "compHUD_pick_close; sixense_write_bindings comphud_pick_pyro.txt; con_logfile cfg/comphud_pick_pyro.txt; compHUD_pick_header"
alias compHUD_pick_demoman  "compHUD_pick_close; sixense_write_bindings comphud_pick_demoman.txt; con_logfile cfg/comphud_pick_demoman.txt; compHUD_pick_header"
alias compHUD_pick_heavy    "compHUD_pick_close; sixense_write_bindings comphud_pick_heavy.txt; con_logfile cfg/comphud_pick_heavy.txt; compHUD_pick_header"
alias compHUD_pick_engineer "compHUD_pick_close; sixense_write_bindings comphud_pick_engineer.txt; con_logfile cfg/comphud_pick_engineer.txt; compHUD_pick_header"
alias compHUD_pick_medic    "compHUD_pick_close; sixense_write_bindings comphud_pick_medic.txt; con_logfile cfg/comphud_pick_medic.txt; compHUD_pick_header"
alias compHUD_pick_sniper   "compHUD_pick_close; sixense_write_bindings comphud_pick_sniper.txt; con_logfile cfg/comphud_pick_sniper.txt; compHUD_pick_header"
alias compHUD_pick_spy      "compHUD_pick_close; sixense_write_bindings comphud_pick_spy.txt; con_logfile cfg/comphud_pick_spy.txt; compHUD_pick_header"
alias compHUD_shortcuts_begin "compHUD_pick_close; exec comphud_notes_restore.cfg; exec comphud_shortcuts_begin"
// The master checkbox caps the frame for every class without changing its saved selection.
sixense_write_bindings comphud_pick_master.txt
con_logfile cfg/comphud_pick_master.txt
compHUD_pick_header
echo Proxies
echo {
echo Clamp
echo {
compHUD_pick_limit
echo }
echo }
compHUD_pick_close
sixense_write_bindings comphud_pick_scout.txt
con_logfile cfg/comphud_pick_scout.txt
compHUD_pick_header
