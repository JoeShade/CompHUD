// Advanced Options applies the notes, key picks and shortcuts in declaration order.
// Set up the shortcut relay even if the dialog was opened from TF2's main Advanced Options.
exec comphud_shortcuts
alias compHUD_pick_limit "echo max 1"
con_logfile ""
sixense_write_bindings comphud_notes_restore.cfg
sixense_clear_bindings
sixense_write_bindings comphud_notes_panel.txt
sixense_write_bindings comphud_notes_handoff.txt

// Each STRING fills one temporary binding. Its listing emits a quoted labelText
// value, preserving spaces and punctuation inside the scoreboard resource.
alias compHUD_notes_write "con_logfile cfg/comphud_notes_panel.txt"
alias compHUD_notes_pause "con_logfile cfg/comphud_notes_handoff.txt"
alias compHUD_note1 "echo Paper; echo {; echo Body; echo {; echo Line1; echo {; compHUD_notes_pause"
alias compHUD_notes_next "compHUD_notes_write; sixense_list_bindings; echo }; compHUD_notes_pause; sixense_clear_bindings; compHUD_notes_write"
alias compHUD_note2 "compHUD_notes_next; echo Line2; echo {; compHUD_notes_pause"
alias compHUD_note3 "compHUD_notes_next; echo Line3; echo {; compHUD_notes_pause"
alias compHUD_notes_close "compHUD_notes_next; echo }; echo }; echo }; echo }; compHUD_notes_pause"
alias compHUD_notes_end "compHUD_notes_close; exec comphud_notes_restore.cfg"
alias compHUD_shortcuts_begin "compHUD_notes_end; exec comphud_shortcuts_begin"
con_timestamp 0
compHUD_notes_write
echo Resource/UI/Scoreboard.res
echo {
echo CompHUDScoreboardNote
echo {
