// Save caption/timer, viewmodel and Ambassador preferences with their derived HUD state.
// These user-owned files live in tf/cfg, outside the HUD and release ZIP.
// Preserve Hydra bindings before using its writer to truncate our four files.
// Run Hydra clear/restore synchronously within the same frame.
con_logfile ""
sixense_write_bindings comphud_sixense_restore.cfg
sixense_clear_bindings
sixense_write_bindings comphud_options_saved.txt
sixense_write_bindings comphud_options_animations.txt
sixense_write_bindings comphud_options_viewmodels.txt
sixense_write_bindings comphud_options_ambassador.txt
exec comphud_sixense_restore.cfg

// Console logging must be plain text for both exec and animation readers.
con_timestamp 0
con_logfile cfg/comphud_options_saved.txt
compHUD_options_save_cfg
compHUD_vm_save_cfg
compHUD_vm_level_save_cfg
compHUD_amby_save_cfg
con_logfile ""

con_logfile cfg/comphud_options_animations.txt
echo "// Restore checkbox displays and timer input together when native SafeMode lays out."
echo "event MMenu_SafeMode_Blink"
echo "{"
compHUD_options_save_animation
compHUD_vm_save_animation
compHUD_vm_level_ui
compHUD_amby_save_ui
echo "RunEventChild ShortcutSaveRelay CompHUDShortcutsCommit 0"
echo "}"
con_logfile ""
// Viewport resources do reload: this optional fragment controls only the viewmodel mask.
con_logfile cfg/comphud_options_viewmodels.txt
echo "// RESOURCE: Restores the independently saved viewmodel mask in the viewport."
echo Resource/HudLayout.res
echo "{"
echo "// PANEL OVERRIDE: Shows the refract mask only while transparent viewmodels are selected."
echo CompHUDTransparentViewmodelMask
echo "{"
compHUD_vm_save_mask
compHUD_vm_level_save_mask
echo "}"
echo "}"
con_logfile ""
// The tracker artwork reloads from its own optional visibility fragment.
con_logfile cfg/comphud_options_ambassador.txt
echo "// RESOURCE: Restores the HUD-only Ambassador overlay preference."
echo Resource/UI/HudAchievementTrackerItem.res
echo "{"
echo "// PANEL OVERRIDE: Restores visibility of the static Ambassador artwork."
echo AmbyCrosshair
echo "{"
compHUD_amby_save_mask
echo "}"
echo "}"
con_logfile ""
// Refresh GameUI through its animation controller, then trigger SafeMode layout to apply the saved state.
// Invalidate SafeMode layout while retaining whether options were already open.
hud_reloadscheme
incrementvar cl_mainmenu_safemode 0 1 1
incrementvar cl_mainmenu_safemode 0 1 1
